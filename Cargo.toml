[package]
name = "sigmaos-shell-config"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SigmaOS declarative shell configuration manager (bar, dock, launcher, theming)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
directories = "5.0"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "sigmaos-shell-config"
path = "src/main.rs"
